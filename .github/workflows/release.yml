name: Release

# Triggered by version tags (v*.*.*).
# Tag on main  →  full release
# Tag with -rc/-beta/-alpha  →  pre-release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version:       ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.branchcheck.outputs.IS_PRERELEASE }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check release type
        id: branchcheck
        run: |
          ON_MAIN=$(git branch -r --contains ${{ github.sha }} | grep -E '^\s*origin/(main|master)$' | head -1 || true)
          if [ -z "$ON_MAIN" ] || echo "${{ github.ref }}" | grep -qE '\-(rc|beta|alpha)'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Atlassian Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>atlassian</id>
                <repositories>
                  <repository>
                    <id>atlassian-external</id>
                    <url>https://packages.atlassian.com/mvn/maven-atlassian-external/</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>atlassian-external</id>
                    <url>https://packages.atlassian.com/mvn/maven-atlassian-external/</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>atlassian</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build
        run: mvn -B clean package -DskipTests -Drevision=${{ env.APP_VERSION }}

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/bb-secret-validator-${{ env.APP_VERSION }}.jar
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
